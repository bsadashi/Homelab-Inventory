apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: racklog-data
  namespace: racklog
  labels:
    app.kubernetes.io/name: racklog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  # storageClassName: standard   # uncomment / replace with your cluster's class
