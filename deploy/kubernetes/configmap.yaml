apiVersion: v1
kind: ConfigMap
metadata:
  name: racklog-config
  namespace: racklog
  labels:
    app.kubernetes.io/name: racklog
data:
  RACKLOG_BIND: "0.0.0.0:8080"
  RACKLOG_DATA_DIR: "/data"
  RACKLOG_LOG_FORMAT: "json"
  RACKLOG_REQUEST_TIMEOUT_SECS: "30"
  RACKLOG_MAX_BODY_BYTES: "2097152"
  RACKLOG_SEED_ON_EMPTY: "true"
  # Tighten origins as needed once the dashboard has a public URL.
  # RACKLOG_ALLOW_ORIGIN: "https://racklog.example.com"
