# Example only. DO NOT COMMIT a real token. Generate one with e.g.
#   openssl rand -base64 48
# and create the secret with:
#   kubectl create secret generic racklog-secret -n racklog \
#     --from-literal=RACKLOG_AUTH_TOKEN="$(openssl rand -base64 48)"
apiVersion: v1
kind: Secret
metadata:
  name: racklog-secret
  namespace: racklog
type: Opaque
stringData:
  RACKLOG_AUTH_TOKEN: "replace-me-with-a-real-token"
