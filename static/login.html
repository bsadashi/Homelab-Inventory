<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<title>RACKLOG · Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0f172a;
    --panel: #1e293b;
    --border: #334155;
    --text: #e5e7eb;
    --muted: #94a3b8;
    --accent: #f59e0b;
    --err: #f87171;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, sans-serif;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.5);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px;
  }
  .brand-mark {
    width: 32px; height: 32px;
    border-radius: 6px;
    background: var(--accent); color: #0f172a;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  .brand-name { font-weight: 600; letter-spacing: 0.04em; }
  h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
  }
  .sub {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type=text], input[type=password] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    font: 14px ui-monospace, 'JetBrains Mono', monospace;
    margin-bottom: 14px;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -2px; }
  button {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #0f172a;
    border: 0;
    border-radius: 4px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }
  .err {
    background: rgba(248,113,113,0.1);
    border: 1px solid var(--err);
    color: var(--err);
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 14px;
    font-size: 12px;
    display: none;
  }
  .toggle {
    margin-top: 14px;
    text-align: center;
    font-size: 12px;
    color: var(--muted);
  }
  .toggle a {
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">RL</div>
      <div class="brand-name">RACKLOG</div>
    </div>
    <h1 id="title">Sign in</h1>
    <div id="sub" class="sub">Enter your credentials to continue.</div>
    <div id="err" class="err"></div>
    <form id="form">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required />
      <button id="submit" type="submit">Sign in</button>
    </form>
    <div id="toggle" class="toggle"></div>
  </div>

<script>
(function () {
  let mode = 'login';
  const titleEl = document.getElementById('title');
  const subEl = document.getElementById('sub');
  const errEl = document.getElementById('err');
  const form = document.getElementById('form');
  const submit = document.getElementById('submit');
  const toggle = document.getElementById('toggle');
  const password = document.getElementById('password');

  function showErr(msg) {
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }
  function clearErr() { errEl.style.display = 'none'; }

  function renderToggle(meta) {
    if (mode === 'login') {
      titleEl.textContent = 'Sign in';
      subEl.textContent = meta.bootstrap_open
        ? 'No accounts yet. Sign up below — the first user becomes the admin.'
        : 'Enter your credentials to continue.';
      submit.textContent = 'Sign in';
      password.autocomplete = 'current-password';
      toggle.innerHTML = (meta.bootstrap_open || meta.open_signup)
        ? '<a id="switch">Sign up instead</a>'
        : '';
      if (meta.bootstrap_open) setMode('signup', meta);
    } else {
      titleEl.textContent = meta.bootstrap_open ? 'Create the first admin' : 'Create an account';
      subEl.textContent = meta.bootstrap_open
        ? 'This is the first signup. Your account will be promoted to admin automatically.'
        : 'Open signups are enabled on this server.';
      submit.textContent = meta.bootstrap_open ? 'Create admin' : 'Create account';
      password.autocomplete = 'new-password';
      toggle.innerHTML = '<a id="switch">Sign in instead</a>';
    }
    const sw = document.getElementById('switch');
    if (sw) sw.addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login', meta));
  }
  function setMode(next, meta) {
    mode = next;
    clearErr();
    renderToggle(meta);
  }

  async function loadMeta() {
    try {
      const r = await fetch('/api/auth/me', { credentials: 'same-origin' });
      if (r.ok) {
        const me = await r.json();
        // Already signed in; bounce to dashboard.
        location.replace('/');
        return null;
      }
      // 401 expected when not signed in — read the bootstrap hint
      // separately via a no-credentials probe.
      const r2 = await fetch('/api/auth/me', { credentials: 'omit' });
      if (r2.ok) return await r2.json();
    } catch (e) { /* fall through */ }
    return { bootstrap_open: false, open_signup: false };
  }

  loadMeta().then((meta) => {
    if (meta === null) return;
    renderToggle(meta);
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    clearErr();
    submit.disabled = true;
    try {
      const body = JSON.stringify({
        username: form.username.value.trim(),
        password: form.password.value,
      });
      const path = mode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
      const r = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body,
      });
      if (!r.ok) {
        let msg = `${r.status}`;
        try {
          const j = await r.json();
          if (j && j.message) msg = j.message;
        } catch (_) {}
        throw new Error(msg);
      }
      location.replace('/');
    } catch (err) {
      showErr(err.message || String(err));
      submit.disabled = false;
    }
  });
})();
</script>
</body>
</html>
